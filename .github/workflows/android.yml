name: Android
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Check translation resources
        shell: pwsh
        run: ./scripts/check-localization.ps1
      - name: Build and test
        run: bash ./gradlew testDebugUnitTest assembleDebug assembleRelease
      - name: Enable KVM for the Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test saved refund journey and capture dashboard
        uses: ReactiveCircus/android-emulator-runner@c9c93e6ba9c4194322e114c40970d5983d9a07cc # v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          emulator-boot-timeout: 180
          script: |
            adb shell wm size 800x1280
            adb shell wm density 160
            bash ./gradlew connectedDebugAndroidTest
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell am instrument -w -e class 'app.refundavio.DashboardJourneyTest#showActionQueuesAndBalancesInDemo' app.refundavio.test/androidx.test.runner.AndroidJUnitRunner | tee app/build/capture-test.txt
            grep -F 'OK (1 test)' app/build/capture-test.txt
            adb exec-out run-as app.refundavio cat files/dashboard-qa.png > app/build/dashboard-qa.png
            python3 -c 'from pathlib import Path; assert Path("app/build/dashboard-qa.png").read_bytes().startswith(bytes.fromhex("89504e470d0a1a0a"))'
            bash -o pipefail -c 'pwsh -NoProfile -File scripts/test-closed-reminders.ps1 -Package app.refundavio -DisposableEmulator | tee app/build/closed-reminders.txt'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-build
          path: |
            app/build/outputs/apk/
            app/build/test-results/
            app/build/outputs/androidTest-results/
            app/build/dashboard-qa.png
            app/build/closed-reminders.txt
