name: Android
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Check translation resources
        shell: pwsh
        run: ./scripts/check-localization.ps1
      - name: Build and test
        run: bash ./gradlew testDebugUnitTest assembleDebug assembleRelease
      - name: Enable KVM for the Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test saved refund journey and capture dashboard
        uses: ReactiveCircus/android-emulator-runner@c9c93e6ba9c4194322e114c40970d5983d9a07cc # v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          emulator-boot-timeout: 180
          script: |
            adb shell wm size 800x1280
            adb shell wm density 160
            bash ./gradlew connectedDebugAndroidTest
            adb exec-out run-as app.refundavio cat files/dashboard-qa.png > app/build/dashboard-qa.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-build
          path: |
            app/build/outputs/apk/
            app/build/test-results/
            app/build/outputs/androidTest-results/
            app/build/dashboard-qa.png
